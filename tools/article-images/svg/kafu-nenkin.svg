<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-label="OR layout two large options widow pension vs death lump sum">
  <!-- OR 二択をさらに大きく。 -->

  <rect x="18" y="70" width="200" height="300" rx="20" fill="none"
        stroke="#ffffff" stroke-width="4" opacity="0.5"/>
  <rect x="38" y="160" width="160" height="90" rx="14" fill="#ffffff" opacity="0.95"/>
  <line x1="48" y1="290" x2="188" y2="290" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round" opacity="0.6"/>
  <line x1="48" y1="280" x2="48" y2="300" stroke="#ffffff" stroke-width="5" opacity="0.75"/>
  <line x1="188" y1="280" x2="188" y2="300" stroke="#ffffff" stroke-width="5" opacity="0.75"/>
  <text x="48" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="700" fill="#ffffff">60</text>
  <text x="188" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="700" fill="#ffffff">65</text>

  <circle cx="250" cy="220" r="38" fill="none" stroke="#e7cd7a" stroke-width="6"/>
  <text x="250" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="700" fill="#e7cd7a">OR</text>

  <rect x="282" y="70" width="200" height="300" rx="20" fill="none"
        stroke="#ffffff" stroke-width="4" opacity="0.5"/>
  <rect x="302" y="150" width="160" height="120" rx="16" fill="#8ec5e8" opacity="0.95"/>
  <text x="382" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="52" font-weight="700" fill="#014172">1×</text>
</svg>
