<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-label="積み上がった自己負担が年間上限の破線に当たって水平になる図">
  <!-- 記事「高額療養費の年間上限」の図版。背景は透過（PowerPoint 側の紺の上に置く）。
       横軸は8月から翌年7月までの12か月。縦軸は自己負担の累計。
       白＝実際に払う自己負担。年間上限（破線）に当たると、そこから先は水平になる。
       青＝上限が無ければ払っていた分＝高額療養費として戻る分。
       日本語は入れない（LibreOffice でのラスタライズをフォントに依存させないため）。
       高さは大小関係だけを表していて、実際の比率ではない。 -->

  <!-- 上限が無かった場合に伸びていた線（比較用） -->
  <polyline points="308,140 308,107 339,107 339,75 370,75 370,42 401,42 401,10 432,10"
            fill="none" stroke="#8ec5e8" stroke-width="3" stroke-dasharray="7 6" opacity="0.85"/>

  <!-- 高額療養費として戻る分（上限に当たったあと、払わずに済む領域） -->
  <path d="M308,140 L308,107 L339,107 L339,75 L370,75 L370,42 L401,42 L401,10 L432,10 L432,140 Z"
        fill="#8ec5e8" opacity="0.5"/>

  <!-- 実際に払う自己負担（累計の階段。8段目で年間上限に達し、以降は水平） -->
  <path d="M60,400
           L60,367 L91,367 L91,335 L122,335 L122,302 L153,302 L153,270
           L184,270 L184,237 L215,237 L215,205 L246,205 L246,172 L277,172
           L277,140 L432,140 L432,400 Z"
        fill="#ffffff" opacity="0.85"/>

  <!-- 年間上限（破線の天井） -->
  <line x1="40" y1="140" x2="452" y2="140" stroke="#e7cd7a" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="16 12"/>
  <text x="462" y="133" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="700" fill="#e7cd7a" text-anchor="end">53</text>

  <!-- 上限に達した位置 -->
  <circle cx="277" cy="140" r="8" fill="#e7cd7a"/>

  <!-- 12か月の目盛り -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="60" y1="400" x2="60" y2="410"/>
    <line x1="91" y1="400" x2="91" y2="410"/>
    <line x1="122" y1="400" x2="122" y2="410"/>
    <line x1="153" y1="400" x2="153" y2="410"/>
    <line x1="184" y1="400" x2="184" y2="410"/>
    <line x1="215" y1="400" x2="215" y2="410"/>
    <line x1="246" y1="400" x2="246" y2="410"/>
    <line x1="277" y1="400" x2="277" y2="410"/>
    <line x1="308" y1="400" x2="308" y2="410"/>
    <line x1="339" y1="400" x2="339" y2="410"/>
    <line x1="370" y1="400" x2="370" y2="410"/>
    <line x1="401" y1="400" x2="401" y2="410"/>
    <line x1="432" y1="400" x2="432" y2="410"/>
  </g>

  <!-- 底の軸 -->
  <line x1="60" y1="400" x2="432" y2="400" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" opacity="0.7"/>
</svg>
