<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-label="3層に積み上がった控除と、その上にある天井">
  <!-- 記事「ふるさと納税の上限額」の図版。背景は透過（PowerPoint 側の紺の上に置く）。
       (1)(2)(3) は総務省「税金の控除について」の3本の計算式の番号に合わせてある。
       破線＝住民税所得割額の20％の天井。その上のはみ出しが自己負担として残る部分。
       高さは大小関係だけを表していて、実際の比率ではない。
       ⚠️ 図は viewBox の左半分（x < 200）に寄せてある。右半分は PowerPoint 側の
          ラベル（build.py の SLIDES["labels"]）の置き場所。ずらすときは両方を一緒に動かす。
       日本語は入れない（ラスタライズをフォントに依存させないため）。名前はラベル側が持つ。 -->

  <!-- 容器 -->
  <rect x="40" y="60" width="160" height="340" rx="14" fill="none"
        stroke="#ffffff" stroke-width="3" opacity="0.5"/>

  <!-- (1) 所得税からの控除 -->
  <rect x="48" y="300" width="144" height="90" rx="6" fill="#ffffff" opacity="0.85"/>
  <text x="120" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="700" fill="#014172">(1)</text>

  <!-- (2) 住民税からの控除（基本分） -->
  <rect x="48" y="228" width="144" height="70" rx="6" fill="#8ec5e8" opacity="0.55"/>
  <text x="120" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="700" fill="#014172">(2)</text>

  <!-- (3) 住民税からの控除（特例分） -->
  <rect x="48" y="112" width="144" height="114" rx="6" fill="#8ec5e8" opacity="0.95"/>
  <text x="120" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="700" fill="#014172">(3)</text>

  <!-- 天井（住民税所得割額の20％）。数字はラベル側に書くので図には入れない -->
  <line x1="20" y1="106" x2="204" y2="106" stroke="#e7cd7a" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="16 12"/>

  <!-- 天井を超えた分＝控除されず自己負担として残る -->
  <rect x="48" y="60" width="144" height="38" rx="6" fill="none"
        stroke="#e7cd7a" stroke-width="3" stroke-dasharray="8 7" opacity="0.9"/>

  <!-- 容器の底。⚠️ ここに 2,000 と書いていたが、図だけでは何の数字か分からないので外した。
       自己負担2,000円の話は本文が持つ。 -->
  <line x1="40" y1="400" x2="200" y2="400" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" opacity="0.7"/>
</svg>
