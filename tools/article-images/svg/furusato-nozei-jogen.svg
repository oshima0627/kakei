<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-label="one deduction stack with yellow ceiling">
  <!-- 1本の積み上げ＋黄色い天井。(1)(2)(3) をさらに大きく。 -->

  <rect x="90" y="40" width="320" height="380" rx="18" fill="none"
        stroke="#ffffff" stroke-width="5" opacity="0.5"/>

  <rect x="106" y="298" width="288" height="108" rx="10" fill="#ffffff" opacity="0.9"/>
  <text x="250" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="64" font-weight="700" fill="#014172">(1)</text>

  <rect x="106" y="210" width="288" height="86" rx="10" fill="#8ec5e8" opacity="0.55"/>
  <text x="250" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="64" font-weight="700" fill="#014172">(2)</text>

  <rect x="106" y="100" width="288" height="108" rx="10" fill="#8ec5e8" opacity="0.95"/>
  <text x="250" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="64" font-weight="700" fill="#014172">(3)</text>

  <line x1="70" y1="92" x2="430" y2="92" stroke="#e7cd7a" stroke-width="8"
        stroke-linecap="round" stroke-dasharray="20 12"/>

  <rect x="106" y="48" width="288" height="36" rx="8" fill="none"
        stroke="#e7cd7a" stroke-width="4" stroke-dasharray="10 8" opacity="0.95"/>

  <line x1="90" y1="420" x2="410" y2="420" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" opacity="0.7"/>
</svg>
