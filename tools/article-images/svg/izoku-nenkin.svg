<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="遺族基礎年金が支給される期間を横の帯で表した図。上段は子がいる世帯で、白い帯が途中の縦の破線までで終わり、その先は黄色い破線の枠だけになる。下段は子がいない世帯で、白い帯が最初から無く、全体が黄色い破線の枠だけになっている">
  <!-- 記事「遺族年金」の図版。背景は透過（PowerPoint 側の紺の上に置く）。

       ⚠️ **金額のグラフではない。** 横は時間、帯の高さは意味を持たない。
       表しているのは「遺族基礎年金が出ている期間かどうか」だけ。

       上段＝子がいる世帯。白い帯が「子が18歳到達年度の末日」で終わる。
       下段＝子がいない世帯。白い帯が最初から無い（はじめから出ない）。
       縦の黄の破線＝子が18歳到達年度の末日。

       日本語は SVG に入れない（ラスタライズをフォントに依存させないため）。
       行名・区間名・注記はすべて PowerPoint 側（build.py の labels / note）。 -->

  <!-- 時間の基準線 -->
  <line x1="52" y1="300" x2="500" y2="300" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" opacity="0.55"/>

  <!-- 上段: 子がいる世帯。出ている期間（白）→ 止まったあと（破線） -->
  <rect x="52" y="88" width="264" height="54" rx="9" fill="#ffffff" opacity="0.92"/>
  <rect x="324" y="88" width="176" height="54" rx="9" fill="none"
        stroke="#e7cd7a" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- 下段: 子がいない世帯。白い帯が無い -->
  <rect x="52" y="196" width="448" height="54" rx="9" fill="none"
        stroke="#e7cd7a" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- 子が18歳到達年度の末日（上段の帯が終わる位置）。
       ⚠️ 下段の箱の中は通さない。通すと「はじめから出ない」のラベルを縦線が串刺しにする
       （実際にそうなった）。上段のぶんと、軸へ降ろすぶんの2本に割ってある。 -->
  <line x1="320" y1="72" x2="320" y2="186" stroke="#e7cd7a" stroke-width="4"
        stroke-dasharray="10 8" stroke-linecap="round"/>
  <line x1="320" y1="260" x2="320" y2="292" stroke="#e7cd7a" stroke-width="4"
        stroke-dasharray="10 8" stroke-linecap="round"/>
</svg>
