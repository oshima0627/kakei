<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-label="giant 103 106 130 150 160 number wall">
  <!-- 記事「扶養の壁」サムネイル向け図版。背景透過。
       ヒーローは巨大な数字。棒は目印程度の細いバー。
       白＝税の壁、青＝社会保険の壁。日本語は入れない。 -->

  <defs>
    <pattern id="brick" width="28" height="18" patternUnits="userSpaceOnUse">
      <rect width="28" height="18" fill="none"/>
      <path d="M0 18 H28 M14 0 V18" stroke="#014172" stroke-width="1.5" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- 地面 -->
  <line x1="18" y1="390" x2="482" y2="390" stroke="#ffffff" stroke-width="3"
        stroke-linecap="round" opacity="0.4"/>

  <!-- 103 税 -->
  <g>
    <rect x="22" y="300" width="78" height="90" rx="6" fill="#ffffff" opacity="0.92"/>
    <rect x="22" y="300" width="78" height="90" rx="6" fill="url(#brick)"/>
    <text x="61" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="58" font-weight="700" fill="#ffffff">103</text>
  </g>

  <!-- 106 社保 -->
  <g>
    <rect x="116" y="278" width="78" height="112" rx="6" fill="#8ec5e8" opacity="0.95"/>
    <rect x="116" y="278" width="78" height="112" rx="6" fill="url(#brick)"/>
    <text x="155" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="58" font-weight="700" fill="#8ec5e8">106</text>
  </g>

  <!-- 130 社保 -->
  <g>
    <rect x="210" y="230" width="78" height="160" rx="6" fill="#8ec5e8" opacity="0.95"/>
    <rect x="210" y="230" width="78" height="160" rx="6" fill="url(#brick)"/>
    <text x="249" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="58" font-weight="700" fill="#8ec5e8">130</text>
  </g>

  <!-- 150 税 -->
  <g>
    <rect x="304" y="175" width="78" height="215" rx="6" fill="#ffffff" opacity="0.92"/>
    <rect x="304" y="175" width="78" height="215" rx="6" fill="url(#brick)"/>
    <text x="343" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="58" font-weight="700" fill="#ffffff">150</text>
  </g>

  <!-- 160 税 -->
  <g>
    <rect x="398" y="120" width="78" height="270" rx="6" fill="#ffffff" opacity="0.92"/>
    <rect x="398" y="120" width="78" height="270" rx="6" fill="url(#brick)"/>
    <text x="437" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="58" font-weight="700" fill="#ffffff">160</text>
  </g>

  <!-- 色分けチップ（文字なし。白＝税／青＝社保はタイトル側で言う） -->
  <rect x="22" y="412" width="28" height="16" rx="3" fill="#ffffff" opacity="0.92"/>
  <rect x="58" y="412" width="28" height="16" rx="3" fill="#8ec5e8" opacity="0.95"/>
</svg>
