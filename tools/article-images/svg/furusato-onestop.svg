<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-label="binary compare tax return vs onestop with one warn badge">
  <!-- 申告 vs ワンストップ。黄×は右列の上・ラベルを隠さない位置。 -->

  <!-- 左：確定申告 -->
  <rect x="28" y="88" width="190" height="280" rx="18" fill="none"
        stroke="#ffffff" stroke-width="4" opacity="0.5"/>
  <rect x="44" y="250" width="158" height="96" rx="12" fill="#ffffff" opacity="0.9"/>
  <rect x="44" y="108" width="158" height="132" rx="12" fill="#8ec5e8" opacity="0.92"/>
  <text x="123" y="188" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="36" font-weight="700" fill="#014172">2</text>
  <text x="123" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="36" font-weight="700" fill="#014172">1</text>

  <!-- 右：ワンストップ -->
  <rect x="282" y="88" width="190" height="280" rx="18" fill="none"
        stroke="#ffffff" stroke-width="4" opacity="0.5"/>
  <rect x="298" y="108" width="158" height="238" rx="12" fill="#8ec5e8" opacity="0.92"/>
  <text x="377" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="44" font-weight="700" fill="#014172">ALL</text>

  <!-- 唯一の warn：右列の上端中央（列ラベルの右隣に置く想定） -->
  <circle cx="455" cy="58" r="30" fill="none" stroke="#e7cd7a" stroke-width="5"/>
  <line x1="437" y1="40" x2="473" y2="76" stroke="#e7cd7a" stroke-width="5" stroke-linecap="round"/>
  <line x1="473" y1="40" x2="437" y2="76" stroke="#e7cd7a" stroke-width="5" stroke-linecap="round"/>

  <!-- 5団体（中央下） -->
  <rect x="155" y="398" width="26" height="32" rx="4" fill="#8ec5e8"/>
  <rect x="189" y="398" width="26" height="32" rx="4" fill="#8ec5e8"/>
  <rect x="223" y="398" width="26" height="32" rx="4" fill="#8ec5e8"/>
  <rect x="257" y="398" width="26" height="32" rx="4" fill="#8ec5e8"/>
  <rect x="291" y="398" width="26" height="32" rx="4" fill="#8ec5e8"/>
</svg>
