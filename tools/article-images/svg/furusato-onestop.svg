<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-label="確定申告とワンストップで控除が効く税目が違う図">
  <!-- 記事「ふるさと納税ワンストップ特例」の図版。背景は透過。
       左列＝確定申告（所得税＋住民税）。右列＝ワンストップ（全額住民税）。
       右列上の黄×＝確定申告すると申請が無効。
       下の5本の青バー＝5団体以内。6本目の黄破線＝6団体以上は対象外。
       日本語は入れない。図は x < 230 に寄せ、右はラベル置き場。 -->

  <!-- 左列：確定申告 -->
  <rect x="28" y="78" width="90" height="280" rx="12" fill="none"
        stroke="#ffffff" stroke-width="2.5" opacity="0.45"/>
  <rect x="36" y="250" width="74" height="96" rx="6" fill="#ffffff" opacity="0.85"/>
  <text x="73" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="700" fill="#014172">(1)</text>
  <rect x="36" y="98" width="74" height="142" rx="6" fill="#8ec5e8" opacity="0.9"/>
  <text x="73" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="700" fill="#014172">(2)(3)</text>

  <!-- 右列：ワンストップ（所得税枠は空の破線、住民税側に全額） -->
  <rect x="138" y="78" width="90" height="280" rx="12" fill="none"
        stroke="#ffffff" stroke-width="2.5" opacity="0.45"/>
  <rect x="146" y="250" width="74" height="96" rx="6" fill="none"
        stroke="#ffffff" stroke-width="2.5" stroke-dasharray="8 7" opacity="0.5"/>
  <rect x="146" y="98" width="74" height="248" rx="6" fill="#8ec5e8" opacity="0.92"/>
  <text x="183" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" font-weight="700" fill="#014172">ALL</text>

  <!-- 確定申告で無効 -->
  <circle cx="183" cy="48" r="22" fill="none" stroke="#e7cd7a" stroke-width="4"/>
  <line x1="171" y1="36" x2="195" y2="60" stroke="#e7cd7a" stroke-width="4" stroke-linecap="round"/>
  <line x1="195" y1="36" x2="171" y2="60" stroke="#e7cd7a" stroke-width="4" stroke-linecap="round"/>

  <!-- 5団体以内／6団体目は対象外 -->
  <rect x="36" y="392" width="14" height="20" rx="2" fill="#8ec5e8"/>
  <rect x="54" y="392" width="14" height="20" rx="2" fill="#8ec5e8"/>
  <rect x="72" y="392" width="14" height="20" rx="2" fill="#8ec5e8"/>
  <rect x="90" y="392" width="14" height="20" rx="2" fill="#8ec5e8"/>
  <rect x="108" y="392" width="14" height="20" rx="2" fill="#8ec5e8"/>
  <rect x="146" y="392" width="14" height="20" rx="2" fill="none"
        stroke="#e7cd7a" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="148" y1="395" x2="158" y2="409" stroke="#e7cd7a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
