<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-label="filing a tax return cancels the one-stop exemption">
  <!-- 物語: 確定申告(OK) → ワンストップに大きな×＝無効。文字は図の中に置かない。 -->

  <!-- 左：確定申告（書類） -->
  <rect x="24" y="70" width="170" height="300" rx="18" fill="none"
        stroke="#ffffff" stroke-width="4" opacity="0.55"/>
  <rect x="44" y="110" width="130" height="220" rx="10" fill="#ffffff" opacity="0.95"/>
  <rect x="62" y="140" width="94" height="14" rx="4" fill="#8ec5e8"/>
  <rect x="62" y="172" width="94" height="14" rx="4" fill="#8ec5e8" opacity="0.75"/>
  <rect x="62" y="204" width="70" height="14" rx="4" fill="#8ec5e8" opacity="0.55"/>
  <rect x="62" y="250" width="94" height="48" rx="8" fill="#014172" opacity="0.9"/>
  <text x="109" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="700" fill="#ffffff">OK</text>

  <!-- 中央：太い矢印 -->
  <line x1="208" y1="220" x2="268" y2="220" stroke="#e7cd7a" stroke-width="16" stroke-linecap="round"/>
  <polygon points="260,190 300,220 260,250" fill="#e7cd7a"/>

  <!-- 右：ワンストップ（薄く・無効対象） -->
  <rect x="306" y="70" width="170" height="300" rx="18" fill="none"
        stroke="#ffffff" stroke-width="4" opacity="0.35"/>
  <rect x="326" y="110" width="130" height="220" rx="10" fill="#8ec5e8" opacity="0.35"/>
  <!-- 書類の行（薄い） -->
  <rect x="344" y="140" width="94" height="12" rx="3" fill="#ffffff" opacity="0.35"/>
  <rect x="344" y="168" width="94" height="12" rx="3" fill="#ffffff" opacity="0.28"/>
  <rect x="344" y="196" width="70" height="12" rx="3" fill="#ffffff" opacity="0.22"/>

  <!-- 大きなキャンセル×（線を太く・輪郭つきで×と読める） -->
  <line x1="348" y1="145" x2="434" y2="295" stroke="#014172" stroke-width="30" stroke-linecap="round"/>
  <line x1="434" y1="145" x2="348" y2="295" stroke="#014172" stroke-width="30" stroke-linecap="round"/>
  <line x1="348" y1="145" x2="434" y2="295" stroke="#e7cd7a" stroke-width="18" stroke-linecap="round"/>
  <line x1="434" y1="145" x2="348" y2="295" stroke="#e7cd7a" stroke-width="18" stroke-linecap="round"/>
</svg>
