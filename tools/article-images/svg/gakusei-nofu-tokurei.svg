<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" role="img" aria-label="Paid vs student deferral vs unpaid: qualifying period yes for deferral, pension amount only if paid">
  <!-- Article: 学生納付特例. Transparent bg (navy PPT behind).
       3 rows × 2 columns: left = qualifying period, right = pension amount.
       Row1 paid: both solid white. Row2 student: left white, right yellow dashed empty.
       Row3 unpaid: both yellow dashed empty. No Japanese in SVG. -->

  <!-- Column headers as thin top ticks (labels in PPT) -->
  <rect x="150" y="36" width="130" height="18" rx="4" fill="#ffffff" opacity="0.25"/>
  <rect x="310" y="36" width="130" height="18" rx="4" fill="#ffffff" opacity="0.25"/>

  <!-- Row 1: paid -->
  <rect x="150" y="90" width="130" height="70" rx="10" fill="#ffffff" opacity="0.92"/>
  <rect x="310" y="90" width="130" height="70" rx="10" fill="#ffffff" opacity="0.92"/>
  <!-- check marks -->
  <polyline points="185,128 202,145 240,110" fill="none" stroke="#014172" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="345,128 362,145 400,110" fill="none" stroke="#014172" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Row 2: student special -->
  <rect x="150" y="200" width="130" height="70" rx="10" fill="#ffffff" opacity="0.92"/>
  <rect x="310" y="200" width="130" height="70" rx="10" fill="none" stroke="#e7cd7a" stroke-width="4" stroke-dasharray="12 9"/>
  <polyline points="185,238 202,255 240,220" fill="none" stroke="#014172" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="345" y1="220" x2="405" y2="250" stroke="#e7cd7a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="405" y1="220" x2="345" y2="250" stroke="#e7cd7a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Row 3: unpaid -->
  <rect x="150" y="310" width="130" height="70" rx="10" fill="none" stroke="#e7cd7a" stroke-width="4" stroke-dasharray="12 9"/>
  <rect x="310" y="310" width="130" height="70" rx="10" fill="none" stroke="#e7cd7a" stroke-width="4" stroke-dasharray="12 9"/>
  <line x1="185" y1="330" x2="245" y2="360" stroke="#e7cd7a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="245" y1="330" x2="185" y2="360" stroke="#e7cd7a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="345" y1="330" x2="405" y2="360" stroke="#e7cd7a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="405" y1="330" x2="345" y2="360" stroke="#e7cd7a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Row label placeholders (left gutter bars; text in PPT) -->
  <rect x="28" y="105" width="100" height="40" rx="6" fill="#8ec5e8" opacity="0.35"/>
  <rect x="28" y="215" width="100" height="40" rx="6" fill="#8ec5e8" opacity="0.55"/>
  <rect x="28" y="325" width="100" height="40" rx="6" fill="#8ec5e8" opacity="0.35"/>
</svg>
