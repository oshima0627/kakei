<svg xmlns="http://www.w3.org/2000/svg" width="520" height="350" viewBox="0 0 520 350" role="img" aria-label="iDeCoの毎月の掛金上限を縦棒の高さで表した図。左の3本が現行で高さがばらばら、右の3本が改正後。右は2本目と3本目が同じ高さに揃い、1本目も左より高くなっている">
  <!-- 記事「iDeCoの掛金上限」の図版。背景は透過（PowerPoint 側の紺の上に置く）。

       縦＝1か月の掛金上限。目盛りは 75,000円 = 190px（1円あたり 0.002533px）で引いた。
         左（現行）      第1号 68,000 → 172px / 第2号 企業年金なし 23,000 → 58px
                         第2号 企業年金あり 20,000 → 51px
         右（改正後）    第1号 75,000 → 190px / 第2号 62,000 → 157px（2本とも同じ）

       改正で「第2号の2本が同じ高さに揃う」ことが、この図の言いたいことのすべて。
       日本語も数字も SVG に入れない（数字だけ置いても何の数字か分からないため。
       金額は本文の表が持つ）。棒の名前・年の区切り・注記は PowerPoint 側。 -->

  <!-- 底の基準線 -->
  <line x1="30" y1="300" x2="500" y2="300" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" opacity="0.55"/>

  <!-- 左: 現行（2026年11月30日まで） -->
  <rect x="40"  y="128" width="56" height="172" rx="7" fill="#ffffff" opacity="0.92"/>
  <rect x="120" y="242" width="56" height="58"  rx="7" fill="#ffffff" opacity="0.92"/>
  <rect x="200" y="249" width="56" height="51"  rx="7" fill="#ffffff" opacity="0.92"/>

  <!-- 右: 改正後（2026年12月1日から）。第2号の2本が同じ高さになる -->
  <rect x="290" y="110" width="56" height="190" rx="7" fill="#ffffff" opacity="0.92"/>
  <rect x="370" y="143" width="56" height="157" rx="7" fill="#ffffff" opacity="0.92"/>
  <rect x="450" y="143" width="56" height="157" rx="7" fill="#ffffff" opacity="0.92"/>

  <!-- 改正後の第2号2本が揃うことを指す破線 -->
  <line x1="360" y1="143" x2="514" y2="143" stroke="#e7cd7a" stroke-width="3"
        stroke-dasharray="10 8" stroke-linecap="round"/>
</svg>
