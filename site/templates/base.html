<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{robots}}

<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script type="application/ld+json">{{jsonLd}}</script>
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-name" href="/">{{siteName}}</a>
    <nav class="gnav" aria-label="サイト内メニュー">{{nav}}</nav>
  </div>
</header>

<div class="l-wrap">
  <main class="l-main" id="main" tabindex="-1">
    {{breadcrumb}}
    {{content}}
  </main>

  <aside class="l-side">
    {{sidebar}}
  </aside>
</div>

<footer class="site-footer">
  <div class="site-footer__inner">
    <nav class="fnav" aria-label="フッターメニュー">{{nav}}</nav>
    {{sns}}
    {{disclosure}}
    <p class="note">
      記事に掲載している金額・要件は、各記事に記載した確認日の時点で、出典として挙げたページに書かれていた内容です。
      制度は改定されます。手続きの前に、必ず出典ページで最新の内容をご確認ください。
      個別の判断については、税務署・年金事務所・お住まいの自治体・専門家にご確認ください。
    </p>
    <p class="copy">&copy; {{year}} {{siteName}}</p>
  </div>
</footer>

<a class="pagetop" href="#" aria-label="ページの先頭へ戻る">↑</a>
{{analytics}}
</body>
</html>
